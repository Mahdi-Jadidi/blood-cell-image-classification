[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-cell-classifier"
version = "1.0.0"
description = "Blood-cell image classification and interpretability with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "Pillow>=10", "scikit-learn>=1.4", "torch>=2.2", "torchvision>=0.17"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blood-cell-classifier = "blood_cell_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]
